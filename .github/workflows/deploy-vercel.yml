name: Deploy To Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      keep:
        description: "保留最近几次部署（更早的会被删除以释放 Deployment Storage）"
        required: false
        default: "3"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: vercel-production-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for key in CONTENT_REPO_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Sync private submodules (content + shared UI library)
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          # 直接把 token 写进每个 submodule 的 URL（落在 .git/config，不进仓库），
          # 不再依赖 insteadOf 的字符串改写：少一层可能失效的机制。
          # 注意不要再跑 git submodule sync，它会把 URL 覆盖回 .gitmodules 的值。
          git config submodule.src/data.url "https://x-access-token:${CONTENT_REPO_TOKEN}@github.com/gintmr/gintmr-blog-content.git"
          git config submodule.vendor/gintmr-ui.url "https://x-access-token:${CONTENT_REPO_TOKEN}@github.com/gintmr/gintmr-ui.git"

          # 诊断：分别用「需要 Contents: Read 的 git 协议」和「只需要 Metadata 的 REST 接口」
          # 验证 token。两者结论不一致时，说明 PAT 缺少 Contents 权限：
          # git 读不到、REST 却返回 200。
          for entry in "src/data:gintmr-blog-content" "vendor/gintmr-ui:gintmr-ui"; do
            path="${entry%%:*}"; repo="${entry##*:}"
            url=$(git config --get "submodule.${path}.url")
            if git ls-remote --exit-code "$url" HEAD >/dev/null 2>&1; then
              echo "    git 可读 ${repo}"
            else
              echo "::error::git 读不到 ${repo}（需要 PAT 的 Contents: Read，不只是把仓库加进范围）"
            fi
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${CONTENT_REPO_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/gintmr/${repo}")
            echo "    REST ${repo} → HTTP ${code}（401=token 失效，404=范围里没有该仓库）"
          done

          # 不让 -e 在这里就中止：收集 git 的完整输出做成注解，
          # 这样定位问题不用再让任何人去翻 Actions 日志
          set +e
          log=$(git submodule update --init --recursive 2>&1)
          status=$?
          set -e
          printf '%s\n' "$log"

          fail=0
          if [ "$status" -ne 0 ]; then
            redacted=$(printf '%s' "$log" | sed "s/${CONTENT_REPO_TOKEN}/***/g" | tr '\n' '|')
            echo "::error::git submodule update 退出码 ${status}，完整输出：${redacted}"
            fail=1
          fi
          for dir in src/data/blog vendor/gintmr-ui/src; do
            if [ ! -d "$dir" ]; then
              echo "::error::submodule 目录缺失：${dir}"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "CONTENT_REPO_TOKEN 需要同时覆盖 gintmr-blog-content 与 gintmr-ui（Contents: Read）"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"

      # npm run build 里已经剪过一遍，这里对 Vercel 自己的输出目录再剪一次：
      # 不管 Vercel 用哪条构建命令，上传的都只有被引用到的资源。
      - name: Prune unreferenced assets before upload
        run: |
          if [ -d .vercel/output/static ]; then
            node scripts/prune-unreferenced-assets.mjs .vercel/output/static
          else
            node scripts/prune-unreferenced-assets.mjs dist
          fi
          du -sh .vercel/output/static 2>/dev/null || du -sh dist

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

      # 站点媒体有 1GB 量级，每次部署都是一份完整快照，10GB 的免费 Deployment Storage
      # 只够几次推送。这里在每次部署后把更早的部署删掉，只留最近几次（够回滚）。
      # 用同一套 VERCEL_* 凭据，不需要额外授权。
      - name: Prune old deployments
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          KEEP: ${{ github.event.inputs.keep || '3' }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          token = os.environ["VERCEL_TOKEN"]
          team = os.environ.get("VERCEL_ORG_ID", "")
          project = os.environ["VERCEL_PROJECT_ID"]
          keep = max(1, int(os.environ.get("KEEP") or 3))
          api = "https://api.vercel.com"

          def call(method, path, **params):
              if team:
                  params["teamId"] = team
              url = api + path + ("?" + urllib.parse.urlencode(params) if params else "")
              req = urllib.request.Request(url, method=method)
              req.add_header("Authorization", "Bearer " + token)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  body = resp.read()
                  return json.loads(body) if body else {}

          try:
              listing = call("GET", "/v6/deployments", projectId=project, limit=100)
          except urllib.error.HTTPError as error:
              print("::warning::取部署列表失败：HTTP %s %s" % (error.code, error.reason))
              sys.exit(0)

          items = listing.get("deployments", [])
          # 已按时间倒序返回；保险起见自己排一次
          items.sort(key=lambda d: d.get("created", 0), reverse=True)
          keep_ids = {d["uid"] for d in items[:keep]}
          print("部署总数 %d，保留最近 %d 次：" % (len(items), len(keep_ids)))
          for d in items[:keep]:
              print("  保留 %s  %s" % (d["uid"], d.get("url", "")))

          removed = failed = 0
          for d in items:
              if d["uid"] in keep_ids:
                  continue
              try:
                  call("DELETE", "/v13/deployments/" + d["uid"])
                  removed += 1
              except urllib.error.HTTPError as error:
                  failed += 1
                  print("  删除失败 %s：HTTP %s %s" % (d["uid"], error.code, error.reason))
          print("已删除 %d 个旧部署，失败 %d 个" % (removed, failed))
          if failed:
              print("::warning::有 %d 个旧部署没删掉，Deployment Storage 可能仍偏高" % failed)
          PY

