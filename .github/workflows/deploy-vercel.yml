name: Deploy To Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: vercel-production-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout site repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required secrets
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for key in CONTENT_REPO_TOKEN VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!key}" ]; then
              echo "Missing required secret: $key"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Sync private submodules (content + shared UI library)
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          # 两个 submodule 都是私有仓库，用同一个只读 token 走 HTTPS 拉取。
          # 两种 URL 形式都改写：.gitmodules 里写成 SSH 或 HTTPS 都能拉到，
          # 免得以后换个地址形式又在这里静默失败。
          git config --global url."https://x-access-token:${CONTENT_REPO_TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${CONTENT_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"
          git submodule sync --recursive

          # 先确认 token 本身能不能读这两个仓库。用 HTTP 状态码区分两种情况，
          # 这样「token 失效」和「token 没覆盖某个仓库」一眼分开（不打印 token）：
          #   401 = token 失效/过期   404 = token 有效但范围里没有这个仓库
          for repo in gintmr-blog-content gintmr-ui; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${CONTENT_REPO_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/gintmr/${repo}")
            case "$code" in
              200) echo "    token 可读 ${repo}" ;;
              401) echo "::error::CONTENT_REPO_TOKEN 无效或已过期（HTTP 401），读 ${repo} 失败——需要重新生成" ;;
              404) echo "::error::CONTENT_REPO_TOKEN 有效但范围里没有 ${repo}（HTTP 404）——需要把该仓库加进 PAT" ;;
              *)   echo "::error::读 ${repo} 返回 HTTP ${code}" ;;
            esac
          done

          # 不让 -e 在这里就中止：先把 git 的原始报错收集起来，
          # 再连同缺失目录一起做成注解（注解在 Actions 页和 API 上都能看到，
          # 不用翻完整日志就能知道是哪个仓库没拉到、为什么）
          set +e
          log=$(git submodule update --init --recursive 2>&1)
          status=$?
          set -e
          printf '%s\n' "$log"

          fail=0
          if [ "$status" -ne 0 ]; then
            echo "::error::git submodule update 退出码 ${status}：$(printf '%s' "$log" | grep -iE 'fatal|error|denied|rights|not found' | tail -6 | tr '\n' ' ')"
            fail=1
          fi
          for dir in src/data/blog vendor/gintmr-ui/src; do
            if [ ! -d "$dir" ]; then
              echo "::error::submodule 目录缺失：${dir}"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "CONTENT_REPO_TOKEN 需要同时覆盖 gintmr-blog-content 与 gintmr-ui（Contents: Read）"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build with Vercel CLI
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: pnpm dlx vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
